[project]
name = "tickmark-financial-research"
version = "1.0.0"
description = "Tickmark Research: verified AI research for financial analysts: cited answers from SEC filings, internal research and the web."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jay Yu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["tickmark", "web", "evals", "tests"]
