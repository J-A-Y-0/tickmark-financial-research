name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (offline, no API keys)
        run: python -m pytest
      - name: Evaluation harness smoke run (offline router only; results not published)
        run: python -m evals.run --routers keyword --limit 8 --out /tmp/eval-smoke
